# GPX clean-up settings
# Restart the app after editing this file.

[cleanup]
# ── Stop detection ────────────────────────────────────────────────────────
# A stop is a run of track points that stay within stop_radius_m of the first
# point for at least stop_min_duration_sec. Needs timestamps in the file.
stop_radius_m = 50
stop_min_duration_sec = 120

# Stops whose centres are closer than this are treated as the same place.
stop_merge_radius_m = 100

# ── Smoothing (Ramer-Douglas-Peucker) ─────────────────────────────────────
# A point is dropped when it is less than rdp_epsilon degrees off the line
# between its neighbours (roughly rdp_epsilon × 111 000 metres; 0.00005 ≈ 5.5 m).
rdp_epsilon = 0.00005

# Only offer smoothing when it would remove at least this share of points (%).
smooth_min_reduction_pct = 2

# ── GPS dropouts ──────────────────────────────────────────────────────────
# Consecutive points further apart than this (km) are flagged as a gap.
gap_min_km = 5

# ── Routing ───────────────────────────────────────────────────────────────
# OSRM endpoint used to suggest gap repairs and re-route through waypoints.
osrm_url = https://router.project-osrm.org/route/v1/driving

# ── Place search ──────────────────────────────────────────────────────────
# Nominatim finds places by name; Overpass finds nearby places by category.
nominatim_url = https://nominatim.openstreetmap.org/search
overpass_url = https://overpass-api.de/api/interpreter
nearby_max_results = 20

# ── OSM lookup ────────────────────────────────────────────────────────────
# "OSM lookup" in the waypoint modal searches for the waypoint's name within
# this radius (metres); "Go to OSM" links open on this site.
osm_lookup_radius_m = 250
osm_url = https://www.openstreetmap.org
