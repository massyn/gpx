<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GPX Editor{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ks-amber: #e8a000;
      --ks-amber-dark: #c47800;
    }
    body {
      background-color: #111;
      min-height: 100vh;
    }
    .navbar {
      border-bottom: 2px solid var(--ks-amber);
      background-color: #1a1a1a !important;
    }
    .navbar-brand {
      color: var(--ks-amber) !important;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 1.3rem;
    }
    .navbar-brand:hover {
      color: var(--ks-amber-dark) !important;
    }
    .btn-amber {
      background-color: var(--ks-amber);
      border-color: var(--ks-amber);
      color: #000;
      font-weight: 600;
    }
    .btn-amber:hover, .btn-amber:focus {
      background-color: var(--ks-amber-dark);
      border-color: var(--ks-amber-dark);
      color: #000;
    }
    .btn-outline-amber {
      border-color: var(--ks-amber);
      color: var(--ks-amber);
    }
    .btn-outline-amber:hover, .btn-outline-amber:focus {
      background-color: var(--ks-amber);
      border-color: var(--ks-amber);
      color: #000;
    }
    h1, h2.page-title {
      color: var(--ks-amber);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">GPX EDITOR</a>
      <a class="nav-link text-secondary small" href="{{ url_for('privacy_zones_page') }}">Privacy Zones</a>
    </div>
  </nav>
  <div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
